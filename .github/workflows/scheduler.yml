name: Minecraft Server Auto Scheduler

on:
  schedule:
    # 11:45 BRT (UTC-3) -> 14:45 UTC de Segunda a Sexta (Disparo da Sessão Supervisionada de 2h)
    - cron: '45 14 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação manual a executar'
        required: true
        default: 'session'
        type: choice
        options:
          - session
          - start_only
          - stop_backup
          - sync_now
      duration_minutes:
        description: 'Duração da sessão em minutos (para modo session)'
        required: false
        default: '120'
        type: string

jobs:
  manage_codespace:
    name: Manage Minecraft Server Session
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Setup GitHub CLI
        run: |
          echo "GitHub CLI version:"
          gh --version

      - name: Execute Managed Minecraft Session
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN || secrets.GITHUB_TOKEN }}
          SPECIFIED_CODESPACE: ${{ vars.CODESPACE_NAME || secrets.CODESPACE_NAME }}
          ACTION_INPUT: ${{ github.event.inputs.action || 'session' }}
          DURATION_INPUT: ${{ github.event.inputs.duration_minutes || '120' }}
        run: |
          CURRENT_HOUR_UTC=$(date -u +%H)
          CURRENT_MIN_UTC=$(date -u +%M)
          echo "Current UTC Time: ${CURRENT_HOUR_UTC}:${CURRENT_MIN_UTC}"
          echo "Requested Action: ${ACTION_INPUT}"

          CODESPACE_NAME="$SPECIFIED_CODESPACE"
          if [ -z "$CODESPACE_NAME" ]; then
            REPO_NAME="${{ github.repository }}"
            CODESPACE_NAME=$(gh codespace list --json name,repository --jq ".[] | select(.repository == \"$REPO_NAME\") | .name" | head -n1)
          fi

          if [ -z "$CODESPACE_NAME" ]; then
            echo "Nenhum Codespace encontrado para o repositório ${{ github.repository }}."
            exit 1
          fi

          echo "Codespace alvo: $CODESPACE_NAME"

          if [ "$ACTION_INPUT" = "start_only" ]; then
            echo ">>> Iniciando serviços e aplicando otimizações no Codespace..."
            gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh start"
            exit 0
          elif [ "$ACTION_INPUT" = "sync_now" ]; then
            echo ">>> Executando sincronização de disco no Codespace..."
            gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh save"
            exit 0
          elif [ "$ACTION_INPUT" = "stop_backup" ]; then
            echo ">>> Executando encerramento gracioso e backup..."
            gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh stop-backup" || true
            gh codespace stop -c "$CODESPACE_NAME"
            exit 0
          fi

          # Modo SESSION (Padrão para agendamentos das 11:45 às 13:45 BRT)
          DURATION_MINUTES="$DURATION_INPUT"
          INTERVAL_SECONDS=300
          TOTAL_SECONDS=$((DURATION_MINUTES * 60))
          ELAPSED=0

          echo "=================================================================="
          echo ">>> INICIANDO SESSÃO SUPERVISIONADA DE ${DURATION_MINUTES} MINUTOS"
          echo "=================================================================="
          
          # Iniciar serviços e aplicar otimizações
          gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh start"

          echo ">>> Mantendo conexão ativa e monitorando a cada 5 minutos..."
          while [ "$ELAPSED" -lt "$TOTAL_SECONDS" ]; do
            sleep "$INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Keepalive ativo | ${REMAINING} minutos restantes..."
            
            # Garante persistência em disco de blocos/chunks e renova sessão
            gh codespace ssh -c "$CODESPACE_NAME" -- "sync && cd /workspaces/minecraft_server && ./manager.sh status" || true
          done

          echo ">>> Duração total da sessão (${DURATION_MINUTES}m) atingida!"

      - name: Graceful Shutdown & Cloud Backup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN || secrets.GITHUB_TOKEN }}
          SPECIFIED_CODESPACE: ${{ vars.CODESPACE_NAME || secrets.CODESPACE_NAME }}
          ACTION_INPUT: ${{ github.event.inputs.action || 'session' }}
        run: |
          if [ "$ACTION_INPUT" = "start_only" ] || [ "$ACTION_INPUT" = "sync_now" ]; then
            echo "Ação única finalizada. Nenhum desligamento necessário."
            exit 0
          fi

          CODESPACE_NAME="$SPECIFIED_CODESPACE"
          if [ -z "$CODESPACE_NAME" ]; then
            REPO_NAME="${{ github.repository }}"
            CODESPACE_NAME=$(gh codespace list --json name,repository --jq ".[] | select(.repository == \"$REPO_NAME\") | .name" | head -n1)
          fi

          if [ -n "$CODESPACE_NAME" ]; then
            echo "=================================================================="
            echo ">>> REALIZANDO SALVAMENTO SEGURO, BACKUP E DESLIGAMENTO..."
            echo "=================================================================="
            gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh stop-backup" || true
            gh codespace stop -c "$CODESPACE_NAME" || true
            echo "✓ Servidor salvo, backup enviado para a nuvem e Codespace desligado com sucesso!"
          fi

