name: Minecraft Server Auto Scheduler

on:
  schedule:
    # 11:45 BRT (UTC-3) -> 14:45 UTC de Segunda a Sexta (Iniciar)
    - cron: '45 14 * * 1-5'
    # 13:45 BRT (UTC-3) -> 16:45 UTC de Segunda a Sexta (Parar + Backup)
    - cron: '45 16 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação manual a executar'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - start
          - stop

jobs:
  manage_codespace:
    name: Manage Minecraft Server
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub CLI
        run: |
          echo "GitHub CLI version:"
          gh --version

      - name: Execute Schedule Action
        env:
          GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
          CODESPACE_NAME: "urban-winner-wrgrpvg5v9j9c9r7j"
          ACTION_INPUT: ${{ github.event.inputs.action || 'auto' }}
        run: |
          CURRENT_HOUR_UTC=$(date -u +%H)
          CURRENT_MIN_UTC=$(date -u +%M)
          echo "Current UTC Time: ${CURRENT_HOUR_UTC}:${CURRENT_MIN_UTC}"
          echo "Requested Action: ${ACTION_INPUT}"

          DECIDED_ACTION="$ACTION_INPUT"

          if [ "$DECIDED_ACTION" = "auto" ]; then
            # Se for por volta das 14h UTC (11h BRT) -> Iniciar
            if [ "$CURRENT_HOUR_UTC" -eq 14 ]; then
              DECIDED_ACTION="start"
            # Se for por volta das 16h UTC (13h BRT) -> Parar
            elif [ "$CURRENT_HOUR_UTC" -eq 16 ]; then
              DECIDED_ACTION="stop"
            else
              echo "Disparo fora da janela padrão. Verifique a execução manual."
              exit 0
            fi
          fi

          if [ "$DECIDED_ACTION" = "start" ]; then
            echo ">>> [1/2] Conectando ao Codespace e iniciando serviços (Playit + Crafty)..."
            gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh 1"
            echo ">>> [2/2] Servidor pronto para conexões!"
          elif [ "$DECIDED_ACTION" = "stop" ]; then
            echo ">>> [1/3] Conectando ao Codespace para rotina de encerramento seguro..."
            gh codespace ssh -c "$CODESPACE_NAME" -- "cd /workspaces/minecraft_server && ./manager.sh 4" || true
            echo ">>> [2/3] Solicitando desligamento do Codespace..."
            gh codespace stop -c "$CODESPACE_NAME"
            echo ">>> [3/3] Codespace desligado com sucesso para economizar horas."
          fi
